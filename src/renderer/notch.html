<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'"
    />
    <title>Mac Notch</title>
    <link rel="stylesheet" href="notch.css" />
    <link rel="stylesheet" href="mascots.css" />
  </head>
  <body>
    <div id="surface">
      <header id="notch" aria-label="AI 任务状态"></header>
      <section id="notification" hidden aria-label="Claude 通知">
        <button id="notification-body" aria-describedby="notification-description">
          <span id="notification-source">Claude</span>
          <strong id="notification-title"><span id="notification-title-text"></span><span id="notification-status" aria-hidden="true"></span></strong>
          <span id="notification-description"></span>
        </button>
        <button id="notification-close" aria-label="关闭通知">×</button>
        <div id="notification-track" aria-hidden="true"><div id="notification-countdown"></div></div>
      </section>
      <main id="dashboard" hidden>
        <div class="dashboard-heading">
          <div id="usage-periods" role="group" aria-label="统计周期">
            <button data-period="day" aria-pressed="true">日</button>
            <button data-period="week" aria-pressed="false">周</button>
            <button data-period="month" aria-pressed="false">月</button>
          </div>
          <button id="collapse" aria-label="收起面板">⌃</button>
        </div>
        <section class="usage-summary" aria-label="本机 Token 用量">
          <div class="today">
            <span id="day-label">今日 Token</span><strong id="tokens">—</strong>
            <div id="cost">正在读取本机用量…</div>
            <div id="breakdown"></div>
          </div>
          <div class="trend">
            <div class="trend-heading">
              <span id="trend-label">今日 · 按小时</span>
            </div>
            <div id="chart" aria-label="每日 Token 用量"></div>
          </div>
        </section>
        <div class="quota-heading">订阅剩余额度</div>
        <section id="quotas" aria-label="订阅剩余额度"></section>
        <footer class="dashboard-footer">
          <span id="updated"></span>
        </footer>
        <p id="notice" role="status"></p>
      </main>
    </div>
    <script src="notification.js"></script>
    <script src="notch-motion.js"></script>
    <script src="mascots.js"></script>
    <script src="notch.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
