<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"
    />
    <title>Mac Notch · 设置</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="titlebar"></div>
    <main>
      <h1>选择你的 AI 工具</h1>
      <p class="intro">只开启你使用的工具，随时可以调整。</p>
      <form id="settings">
        <label class="provider"
          ><img src="../../assets/claude.svg" alt="" /><span
            ><b>Claude Code</b><small>任务状态与订阅额度</small></span
          ><input
            id="claude"
            type="checkbox"
            role="switch"
            aria-label="开启 Claude Code" /><i></i
        ></label>
        <label class="provider"
          ><img src="../../assets/codex.svg" alt="" /><span
            ><b>Codex</b><small>任务状态与订阅额度</small></span
          ><input
            id="codex"
            type="checkbox"
            role="switch"
            aria-label="开启 Codex" /><i></i
        ></label>
        <label class="login"
          ><input id="login" type="checkbox" /> 登录时启动</label
        >
        <p class="hint">
          单击刘海打开工具，双击查看用量与额度。<br />没有获取 Claude 状态？运行
          Claude Code CLI（<code>claude</code>），完成订阅账号登录后刷新。
        </p>
        <p id="notice" role="status"></p>
        <button type="submit" id="save">开始使用</button>
      </form>
      <footer>
        <span id="version"></span><button id="quit">退出 Mac Notch</button>
      </footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
