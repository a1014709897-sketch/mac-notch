<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"
    />
    <title>Mac Notch · 设置</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="titlebar"></div>
    <main>
      <h1>选择你的 AI 工具</h1>
      <p class="intro">只开启你使用的工具，修改后立即生效。</p>
      <form id="settings">
        <label class="provider"
          ><img src="../../assets/claude.svg" alt="" /><span
            ><b>Claude Code</b><small>任务状态与订阅额度</small></span
          ><input
            id="claude"
            type="checkbox"
            role="switch"
            aria-label="开启 Claude Code" /><i></i
        ></label>
        <label class="provider"
          ><img src="../../assets/codex.svg" alt="" /><span
            ><b>Codex</b><small>任务状态与订阅额度</small></span
          ><input
            id="codex"
            type="checkbox"
            role="switch"
            aria-label="开启 Codex" /><i></i
        ></label>
        <fieldset class="display-settings notification-settings">
          <legend>通知</legend>
          <article class="notification-option">
            <label><input id="assistance-notifications" type="checkbox" role="switch" checked /> 需要协助通知</label>
            <small>新问题出现时提醒一次；关闭通知不会清除待处理状态。</small>
            <img src="../../assets/notification-waiting.png" alt="协助通知效果：Codex 需要你处理，请选择接下来执行的方案。" />
            <button type="button" class="secondary" data-preview="waiting">预览协助通知</button>
          </article>
          <article class="notification-option">
            <label><input id="notifications" type="checkbox" role="switch" checked /> 任务完成通知</label>
            <small>本轮任务完成时提醒；关闭后保留刘海完成状态。</small>
            <img src="../../assets/notification-ended.png" alt="完成通知效果：Codex 本轮任务已完成，可以回到会话查看。" />
            <button type="button" class="secondary" data-preview="ended">预览完成通知</button>
          </article>
        </fieldset>
        <fieldset class="display-settings">
          <legend>显示方式</legend>
          <label><input id="idle-quota" type="checkbox" role="switch" checked /> 刘海条空闲时显示剩余额度</label>
          <small>图标＋剩余百分比；有任务时优先显示任务状态。</small>
          <label><input id="menu-claude" type="checkbox" role="switch" /> 菜单栏显示 Claude</label>
          <label><input id="menu-codex" type="checkbox" role="switch" /> 菜单栏显示 Codex</label>
          <small>隐藏菜单栏板块不影响任务监测；打开 Mac Notch 应用可返回设置。</small>
        </fieldset>
        <fieldset class="display-settings">
          <legend>刘海条操作</legend>
          <p class="hint" id="gesture-description">右击打开控制页，双击查看用量与额度。</p>
          <label><input id="swap-gestures" type="checkbox" role="switch" /> 交换右击与双击</label>
          <small id="gesture-feedback" role="status">两项操作会一起交换，避免手势冲突。单击始终打开工具。</small>
        </fieldset>
        <label class="login"
          ><input id="login" type="checkbox" /> 登录时启动</label
        >
        <p class="hint">
          没有获取 Claude 状态？运行
          Claude Code CLI（<code>claude</code>），完成订阅账号登录后刷新。
        </p>
        <p id="notice" role="status"></p>
      </form>
      <section class="update-settings" aria-label="版本更新">
        <b>版本更新</b>
        <p id="update-status" role="status">手动检查 Mac Notch 新版本。</p>
        <div class="update-actions">
          <button type="button" class="secondary" id="check-update">检查更新</button>
          <button type="button" class="secondary" id="download-update" hidden>下载安装包</button>
          <button type="button" class="secondary" id="open-update" hidden>打开安装包</button>
        </div>
        <progress id="update-progress" max="100" value="0" hidden aria-label="安装包下载进度"></progress>
        <details id="release-notes" hidden><summary>更新说明</summary><p id="release-notes-text"></p></details>
      </section>
      <footer>
        <span id="version"></span><button id="quit">退出 Mac Notch</button>
      </footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
