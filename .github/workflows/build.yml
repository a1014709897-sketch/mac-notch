name: Verify and build macOS
on:
  push:
    paths-ignore:
      - .github/workflows/publish.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --cpu=${{ matrix.arch }} --os=darwin --ignore-scripts
      - run: npm run verify
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-mac.js ${{ matrix.arch }}
      - run: npm run source && npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-Notch-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
